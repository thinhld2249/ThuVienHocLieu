name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

jobs:
  api:
    name: API build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore & build
        run: dotnet build apps/api/HocLieu.sln -c Release
      - name: Test (Testcontainers dùng Docker của runner)
        run: dotnet test apps/api/HocLieu.sln -c Release --no-build

  web:
    name: Web lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web build

  openapi:
    name: Kiểm tra api-types.ts khớp OpenAPI
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm --dir apps/web install --frozen-lockfile
      - name: Chạy API (không migrate)
        run: |
          cd apps/api
          ASPNETCORE_URLS=http://localhost:8080 \
          Db__MigrateOnStartup=false \
          ConnectionStrings__Default="Host=localhost;Database=nope;Username=nope;Password=nope" \
          dotnet run --project src/HocLieu.Api > /tmp/api.log 2>&1 &
      - name: Chờ API sẵn sàng
        run: |
          for i in $(seq 1 45); do
            curl -sf http://localhost:8080/openapi/v1.json > /dev/null && exit 0
            sleep 2
          done
          cat /tmp/api.log
          exit 1
      - name: Sinh lại types & diff
        run: |
          pnpm --dir apps/web gen:api
          git diff --exit-code -- apps/web/src/lib/api-types.ts || (
            echo "::error::api-types.ts lệch với OpenAPI — chạy `make gen-api` và commit lại"
            exit 1
          )

  publish:
    name: Build & push images (GHCR)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [api, web, openapi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ghcr.io/${{ vars.GHCR_ORG || 'hoclieu' }}/hoclieu-api:latest
            ghcr.io/${{ vars.GHCR_ORG || 'hoclieu' }}/hoclieu-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          tags: |
            ghcr.io/${{ vars.GHCR_ORG || 'hoclieu' }}/hoclieu-web:latest
            ghcr.io/${{ vars.GHCR_ORG || 'hoclieu' }}/hoclieu-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
