# Production stack: 1 VM · docker compose. Chi tiết: README.md, docs/van-hanh.md
services:
  web: # Caddy + React dist
    build:
      context: ../apps/web
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    image: ghcr.io/${GHCR_ORG:-local}/hoclieu-web:${TAG:-latest}
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - caddy_data:/data
    restart: unless-stopped
    depends_on:
      - api

  api:
    build: ../apps/api
    image: ghcr.io/${GHCR_ORG:-local}/hoclieu-api:${TAG:-latest}
    env_file: .env
    environment:
      # Storage local fallback khi chưa cấu hình Cloudinary (decisions.md M3)
      Storage__LocalRoot: /app/data
    volumes:
      - filedata:/app/data
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      gotenberg:
        condition: service_started

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: hoclieu
      POSTGRES_USER: hoclieu
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoclieu -d hoclieu"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gotenberg:
    build: ./gotenberg
    restart: unless-stopped

  backup:
    image: prodrigestivill/postgres-backup-local
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: hoclieu
      POSTGRES_USER: hoclieu
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "14"
    volumes:
      - ./backups:/backups
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: {}
  caddy_data: {}
  filedata: {}
